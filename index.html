<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Myメモ（最小）</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
     textarea { width: 100%; height: 200px; }
    button { padding: 10px 16px; font-size: 16px; }
  </style>
</head>
<body>

<h1>Myメモ（保存のみ）</h1>
  
<input id="moodInput" placeholder="ひとこと（自由）">  
<textarea id="bodyInput" placeholder="ここにメモを書く"></textarea>
<br><br>

 <button id="saveBtn" type="button">保存</button>
 
<button id="exportCsvBtn">CSV書き出し</button>
  
<!-- ① 先に外部JSを読む（App.actions を先に用意する） -->
<script src="js/app.js"></script>
<script src="js/storage.js"></script>
<script src="js/actions.js"></script>
<script src="js/export_csv.js"></script>  
<script src="js/render.js"></script>

<!-- ② 最後に “配線だけ” を書く -->
<script>
  window.App = window.App || {};
  App.dom = {
    bodyInput: document.getElementById("bodyInput"),
    saveBtn: document.getElementById("saveBtn"),
  };
  App.state = App.state || {};
  App.state.memos = App.state.memos || [];
   // ★ここで登録（actions.js 読み込み後なので確実）
  App.dom.saveBtn.addEventListener("click", () => App.actions.doSave());
  //ＣＳＶ書き出し
  document.getElementById("exportCsvBtn")
  .addEventListener("click", () => App.actions.exportCSV());

  // DOM参照
  App.dom.bodyInput = document.getElementById("bodyInput");
  App.dom.saveBtn   = document.getElementById("saveBtn");

  // クリック配線（ここで App.actions.doSave が存在する）
  App.dom.saveBtn.addEventListener("click", App.actions.doSave);
</script>

</body>
</html>
